<!--
  GradientText — a linear gradient clipped to text.

  Edit the gradient colors and direction in `background-image`. For a version
  that flows across the letters, see the Animated Gradient Text snippet.
-->
<style>
  .gradient-text {
    display: inline-block;
    background-image: linear-gradient(90deg, #ffaa40, #9c40ff, #ffaa40);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }
</style>

<span class="gradient-text">Gradient Text</span>
