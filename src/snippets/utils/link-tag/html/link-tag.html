<!--
  LinkTag (HTML) — there is no component abstraction in plain HTML, so the
  "universal link" is just choosing the right element for each case. Zero
  dependencies, paste anywhere.
-->

<!-- Internal or external navigation -->
<a href="/dashboard">Dashboard</a>

<!-- External link opened in a new tab.
     Always pair target="_blank" with rel="noopener noreferrer". -->
<a href="https://example.com" target="_blank" rel="noopener noreferrer">
  Example
</a>

<!-- "No link" — content without navigation -->
<div>Not a link</div>
